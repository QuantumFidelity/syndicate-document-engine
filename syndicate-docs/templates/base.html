<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$title$</title>
    <link rel="stylesheet" href="../templates/styles.css" />
  </head>
  <body>
    <div class="doc-shell">
      <div class="page">
        <header class="header">
          <div class="branding">
            <img
              src="../assets/logo-primary-print.png"
              alt="Syndicate Systems Advisory"
              class="header-logo"
              width="252"
              height="74"
            />
          </div>
          <div class="contact-section">
            <div class="divider-vertical"></div>
            <div class="contact">
              <a href="mailto:contact@syndicatesystems.co" class="contact-link">contact@syndicatesystems.co</a>
              <a href="tel:+17027068806" class="contact-link">(702) 706-8806</a>
              <a href="https://syndicatesystems.co" class="contact-link">syndicatesystems.co</a>
            </div>
          </div>
        </header>

        <div class="header-body-divider">
          <img
            src="../assets/cover-asset-print.png"
            alt=""
            aria-hidden="true"
            class="header-body-divider-asset"
          />
        </div>

        <div class="title-block">
          <h1 class="doc-title">$title$</h1>

          $if(subtitle)$
          <p class="doc-subtitle">$subtitle$</p>
          $endif$

          <div class="cover-meta" aria-label="Document details">
            $if(client)$
            <div class="meta-row">
              <span class="meta-label">Client</span>
              <span class="meta-value">$client$</span>
            </div>
            $endif$

            $if(date)$
            <div class="meta-row">
              <span class="meta-label">Date</span>
              <span class="meta-value">$date$</span>
            </div>
            $endif$
          </div>
        </div>

        <main class="content">
          $body$
        </main>
      </div>
    </div>

    <footer class="page-footer" aria-hidden="true">
      <div class="footer-inner">
        <img
          src="../assets/footer-mark-print.png"
          alt=""
          class="footer-mark"
          width="20"
          height="20"
        />
      </div>
    </footer>
  </body>
</html>
