<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$title$</title>
    <link rel="stylesheet" href="../templates/styles.css" />
  </head>
  <body>
    <div class="doc-shell">
      <div class="page">
        <header class="header-band">
          <div class="header-band-inner">
            <div class="header-band-left">
              <img
                src="../assets/logo-primary.png"
                alt="Syndicate Systems"
                class="brand-asset logo-primary"
              />
            </div>
            <div class="header-band-right">
              <img
                src="../assets/contact-block.png"
                alt="contact@syndicatesystems.co (702) 706-8806 syndicatesystems.co"
                class="brand-asset contact-block"
              />
            </div>
          </div>
        </header>

        <div class="cover-divider">
          <img
            src="../assets/cover-asset.png"
            alt=""
            aria-hidden="true"
            class="brand-asset cover-asset"
          />
        </div>

        <div class="title-block">
          <h1 class="doc-title">$title$</h1>

          $if(subtitle)$
          <p class="doc-subtitle">$subtitle$</p>
          $endif$

          <div class="cover-meta" aria-label="Document details">
            $if(client)$
            <div class="meta-row">
              <span class="meta-label">Client</span>
              <span class="meta-value">$client$</span>
            </div>
            $endif$

            $if(date)$
            <div class="meta-row">
              <span class="meta-label">Date</span>
              <span class="meta-value">$date$</span>
            </div>
            $endif$
          </div>

          <div class="title-divider" aria-hidden="true"></div>
        </div>

        <main class="content">
          $body$
        </main>

        <footer class="page-footer">
          <div class="footer-inner">
            <div class="footer-mark-wrap">
              <img
                src="../assets/footer-mark.png"
                alt="Syndicate Systems"
                class="brand-asset footer-mark"
              />
            </div>
            <span class="page-label">PAGE</span>
            <span class="page-number"></span>
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
